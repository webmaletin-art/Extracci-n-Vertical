name: Pruebas y APK

# Corre las pruebas automáticas y compila un APK de prueba (debug, firmado con una clave descartable que se genera en
# cada ejecución: no hay claves en el repositorio). Se lanza a mano (Actions → Pruebas y APK → Run workflow) o al subir
# cambios. El APK queda en «Artifacts» de la ejecución.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "*.md"]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Caché de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Instalar Godot y plantillas
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz && rm tpl.tpz
      - name: Configurar Godot y clave de prueba descartable
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          sudo ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -validity 9999 -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2
      - name: Importar
        run: godot --headless --path . --import 2>&1 | tail -n 3 || true
      - name: Pruebas
        run: tools/run_tests.sh
      - name: Exportar APK (debug)
        run: |
          mkdir -p build
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg
          godot --headless --path . --export-debug "Android" build/ExtraccionVertical.apk 2>&1 | grep -vE "RID|Leaked|resources still" | tail -n 20
          test -f build/ExtraccionVertical.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ExtraccionVertical-apk
          path: build/ExtraccionVertical.apk
